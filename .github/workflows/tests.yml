name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            dir: packages/ekido_core
            path: "."
          - suite: runtime
            dir: workers/runtime
            path: ".:../../packages/ekido_core"
          - suite: agent
            dir: workers/agent
            path: ".:../../packages/ekido_core"
          - suite: coordinator
            dir: apps/coordinator
            path: ".:../../packages/ekido_core"
          - suite: verifier
            dir: workers/verifier
            path: ".:../../packages/ekido_core:../../workers/runtime"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors numpy eth-account "sqlalchemy>=2" "fastapi>=0.115" httpx pydantic-settings websockets "uvicorn>=0.30" web3
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        env:
          PYTHONPATH: ${{ matrix.path }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-combined
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-combined/package-lock.json
      - run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Production build
        run: npx next build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - name: Fetch libraries
        run: |
          git clone --depth 1 --branch v1.17.0 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
      - run: forge build --sizes
      - run: forge test

  slither:
    name: Slither
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - name: Fetch libraries
        run: |
          git clone --depth 1 --branch v1.17.0 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
      - run: pip install slither-analyzer==0.11.6
      # Same filters as contracts/security/slither-report.md. Slither's exit code is ignored here;
      # the check below decides, so a Low or Informational result does not fail the job.
      - name: Run Slither
        run: slither . --filter-paths "lib/|test/|script/" --json slither.json || true
      # Fails on any High or Medium result except the two false positives triaged in
      # slither-report.md (#1, #2): locals that deliberately start at their default value.
      # They are matched by variable, function and contract, so the same detector firing
      # anywhere else still fails the job.
      - name: Fail on new Medium or High results
        run: python security/check_slither.py slither.json
