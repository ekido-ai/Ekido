name: Gate

# The shared merge gate for every Ekido repo: the PR report ("no report, no merge") and a conventional PR title.
# Other repos call it with:  uses: ekido-ai/Ekido/.github/workflows/gate.yml@main
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: PR report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ekido-ai/Ekido
          ref: main
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the report sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python .github/scripts/pr_report.py

  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            perf
            build
            revert
