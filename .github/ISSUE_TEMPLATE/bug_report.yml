name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, Coordinator, Provider kit or agent, Training runtime, Verifier, Contracts, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser or Python version, GPU if relevant. Never paste private keys or .env contents.
  - type: markdown
    attributes:
      value: "Found a security problem? Please don't open an issue: use **Security → Report a vulnerability** instead."
